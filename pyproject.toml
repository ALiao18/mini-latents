[project]
name = "mini-latents"
version = "0.1.0"
description = "Custom linear latent variable models (PCA, pPCA, FA)"
readme = "README.md"
authors = [
    { name = "ALiao18", email = "oail.werdna@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "jax>=0.11.1",
    "matplotlib>=3.11.1",
    "nbformat>=5.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "plotly>=6.0.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.1",
]

[project.scripts]
mini-latents = "mini_latents:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
