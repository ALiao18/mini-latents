[project]
name = "mini-latents"
version = "0.1.0"
description = "Custom linear latent variable models (PCA, pPCA, FA)"
readme = "README.md"
authors = [
    { name = "ALiao18", email = "oail.werdna@gmail.com" }
]
requires-python = ">=3.12, <3.15"
dependencies = [
    "numpy>=2.5.2",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.1",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=8",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = ["fit: fits a model to convergence (deselect with -m \"not fit\")"]
